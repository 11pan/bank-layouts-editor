name: Check for new release of abextm/osrs-cache
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false # otherwise, the token used is the GITHUB_TOKEN, instead of your personal access token.
          fetch-depth: 0 # otherwise, there would be errors pushing refs to the destination repository.

      - name: Get latest release
        id: get_release
        run: |
          set -euo pipefail

          RESPONSE=$(curl -sfL \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/abextm/osrs-cache/releases/latest")

          FULL_TAG=$(echo "$RESPONSE" | jq -er '.tag_name') || {
            echo "::error::Could not read .tag_name from the API response"
            echo "$RESPONSE" | head -c 500
            exit 1
          }

          RELEASE_TAG=$(echo "$FULL_TAG" | grep -oP '^\d{4}-\d{2}-\d{2}') || {
            echo "::error::Tag '$FULL_TAG' does not start with a YYYY-MM-DD date"
            exit 1
          }

          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "full tag: $FULL_TAG"
          echo "latest release: $RELEASE_TAG"

      - name: Compare with previous release
        id: compare_release
        run: |
          set -euo pipefail

          PREVIOUS_RELEASE=$(tr -d '[:space:]' < data/item-db-version.txt)
          echo "previous release: $PREVIOUS_RELEASE"

          if [ "${{ steps.get_release.outputs.release_tag }}" != "$PREVIOUS_RELEASE" ]; then
            echo "release_changed=true" >> $GITHUB_OUTPUT
            echo "Release changed: true"
          else
            echo "release_changed=false" >> $GITHUB_OUTPUT
            echo "Release changed: false"
          fi

      - name: Call workflow to update the db
        if: steps.compare_release.outputs.release_changed == 'true'
        uses: benc-uk/workflow-dispatch@v1
        with:
          workflow: update_itemdb.yml
